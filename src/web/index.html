<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Doctor Appointment Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container mt-5">
      <div class="dashboard-header text-center">
        <h2>DOCTOR'S APPOINTMENTS DASHBOARD</h2>
        <h5 class="mt-2">Today's Appointments</h5>
      </div>
      <div class="card p-3 mb-4 shadow bg-body-tertiary">
        <div class="row">
          <div class="col-md-4">
            <label class="form-label fw-bold">Filter By Doctor</label>
            <select id="doctorFilter" class="form-select border border-5">
              <option value="All">All Doctors</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label fw-bold">Filter By Status</label>
            <select id="statusFilter" class="form-select border border-5">
              <option value="All">All Status</option>
              <option value="BOOKED">BOOKED</option>
              <option value="CANCELLED">CANCELLED</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label fw-bold">Search Patient</label>
            <input type="text" id="searchPatient" class="form-control border border-5" placeholder="Enter patient name"/>
          </div>
        </div>
      </div>
      <div class="card shadow-sm p-3 shodow">
          <h4 class="mb-3">Appointment List</h4>
          <div class="table-responsive">
          <table class="table table-bordered table-hover table-striped">
            <thead>
              <tr>
                <th>Appointment ID</th>
                <th>Doctor</th>
                <th>Patient</th>
                <th>Contact Number</th>
                <th>Specialisation</th>
                <th>Fees (₹)</th>
                <th>Time</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="appointmentTableBody"></tbody>
          </table>
        </div>
      </div>
      <div class="footer">
        <p>Doctor Appointment Management System</p>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
